const regionFilter = document.querySelector("#regionFilter");
const sectorFilter = document.querySelector("#sectorFilter");
const roomFilter = document.querySelector("#roomFilter");
const typeFilterField = document.querySelector("#typeFilterField");
const typeFilterLabel = document.querySelector("#typeFilterLabel");
const areaFilter = document.querySelector("#areaFilter");
const areaFilterLabel = document.querySelector("#areaFilterLabel");
const priceFilter = document.querySelector("#priceFilter");
const priceFilterLabel = document.querySelector("#priceFilterLabel");
const resetFiltersButton = document.querySelector("#resetFiltersButton");
const applyFilterButton = document.querySelector("#applyFilterButton");
const filterSummary = document.querySelector("#filterSummary");
const propertyList = document.querySelector("#propertyList");
const emptyState = document.querySelector("#emptyState");
const propertyTypeTabs = [...document.querySelectorAll(".property-type-tab")];
const mapFab = document.querySelector("#mapFab");
const mapLink = document.querySelector("#mapLink");
const mapLabel = document.querySelector("#mapLabel");
const filterControls = [searchInput, regionFilter, sectorFilter, roomFilter, areaFilter, priceFilter];

function setFilterModalVisibility(visible) {
  filterModal.classList.toggle("hidden", !visible);
  document.body.classList.toggle("overflow-hidden", visible);
  openFilterButton.setAttribute("aria-expanded", String(visible));
}

function getActiveFilterCount() {
  return [
    regionFilter.value,
    sectorFilter.value,
    roomFilter.value,
    areaFilter.value,
    priceFilter.value
  ].filter(Boolean).length;
}

function getSelectedPriceRange(value) {
  if (!value) {
    return null;
  }

  if (value.endsWith("+")) {
    return { min: Number(value.replace("+", "")), max: Number.POSITIVE_INFINITY };
  }

  const [min, max] = value.split("-").map(Number);
  return { min, max };
}

function getSelectedAreaRange(value) {
  if (!value) {
    return null;
  }

  if (value.endsWith("+")) {
    return { min: Number(value.replace("+", "")), max: Number.POSITIVE_INFINITY };
  }

  const [min, max] = value.split("-").map(Number);
  return { min, max };
}

function getPropertySizeRange(property) {
  const match = property.sizeRange.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);
  if (!match) {
    return { min: 0, max: Number.POSITIVE_INFINITY };
  }

  return {
    min: Number(match[1]),
    max: Number(match[2])
  };
}

function getPropertyRooms(property) {
  if (Array.isArray(property.roomTypes)) {
    return property.roomTypes;
  }

  const rooms = [...property.unitMeta.matchAll(/(\d+)房/g)].map((match) => Number(match[1]));
  return rooms.length ? rooms : [];
}

function getActiveProperties() {
  return properties.filter((property) => property.category === activePropertyType);
}

function populateFilterOptions() {
  const activeProperties = getActiveProperties();
  const config = propertyTypeConfig[activePropertyType];
  const regions = [...new Set(activeProperties.map((property) => property.region))];
  const sectors = [...new Set(activeProperties.map((property) => property.sector))];
  const facets = activePropertyType === "residential"
    ? [...new Set(activeProperties.flatMap(getPropertyRooms))].sort((left, right) => left - right)
    : [...new Set(activeProperties.map((property) => {
      if (activePropertyType === "apartment") return property.apartmentType;
      if (activePropertyType === "commercial") return property.buildingType;
      return property.propertyLevel;
    }).filter(Boolean))];

  regionFilter.innerHTML = [
    '<option value="">全部区域</option>',
    ...regions.map((region) => `<option value="${region}">${region}</option>`)
  ].join("");

  sectorFilter.innerHTML = [
    '<option value="">全部板块</option>',
    ...sectors.map((sector) => `<option value="${sector}">${sector}</option>`)
  ].join("");

  roomFilter.innerHTML = [
    `<option value="">${config.facetPlaceholder}</option>`,
    ...facets.map((facet) => `<option value="${facet}">${activePropertyType === "residential" ? `${facet}室` : facet}</option>`)
  ].join("");

  areaFilter.innerHTML = [
    `<option value="">全部${config.areaLabel}</option>`,
    ...config.areaOptions.map(([value, label]) => `<option value="${value}">${label}</option>`)
  ].join("");

  priceFilter.innerHTML = [
    `<option value="">全部${config.priceLabel}</option>`,
    ...config.priceOptions.map(([value, label]) => `<option value="${value}">${label}</option>`)
  ].join("");
}

function getBadgeClasses(tone) {
  return tone === "primary"
    ? "bg-primary/90 text-on-primary"
    : "bg-tertiary-fixed/90 text-on-tertiary-fixed";
}

function getProjectDetailUrl(property) {
  if (Object.prototype.hasOwnProperty.call(property, "detailUrl")) {
    return property.detailUrl;
  }
  const projectId = property.projectId || "home-greenland";
  return `${PROJECT_DETAIL_PATH}?projectId=${encodeURIComponent(projectId)}`;
}

function syncPropertyTypeUI() {
  const config = propertyTypeConfig[activePropertyType];
  document.title = `透明房产 - ${config.label}楼盘`;
  typeFilterField.classList.toggle("hidden", !config.facetVisible);
  typeFilterLabel.textContent = config.facetLabel;
  areaFilterLabel.textContent = config.areaLabel;
  priceFilterLabel.textContent = config.priceLabel;
  propertyTypeTabs.forEach((button) => {
    const isActive = button.dataset.propertyType === activePropertyType;
    button.setAttribute("aria-selected", String(isActive));
    button.classList.toggle("border-primary", isActive);
    button.classList.toggle("text-primary", isActive);
    button.classList.toggle("font-extrabold", isActive);
    button.classList.toggle("border-transparent", !isActive);
    button.classList.toggle("text-secondary", !isActive);
    button.classList.toggle("font-bold", !isActive);
  });
  mapFab.style.display = config.mapHref ? "" : "none";
  if (config.mapHref) {
    mapLink.href = config.mapHref;
    mapLabel.textContent = config.mapLabel;
  }
}

function setActivePropertyType(type) {
  if (!propertyTypeConfig[type]) {
    return;
  }
  activePropertyType = type;
  regionFilter.value = "";
  sectorFilter.value = "";
  roomFilter.value = "";
  areaFilter.value = "";
  priceFilter.value = "";
  populateFilterOptions();
  syncPropertyTypeUI();
  applyFilters();
  const url = new URL(window.location.href);
  url.searchParams.set("tab", type);
  window.history.replaceState({}, "", url);
}

function getFollowedProjects() {
  try {
    const stored = JSON.parse(window.localStorage.getItem(FOLLOWED_PROJECTS_KEY) || "[]");
    return new Set(Array.isArray(stored) ? stored : []);
  } catch (_error) {
    return new Set();
  }
}

function toggleFollowedProject(projectId) {
  const followed = getFollowedProjects();
  if (followed.has(projectId)) {
    followed.delete(projectId);
  } else {
    followed.add(projectId);
  }
  window.localStorage.setItem(FOLLOWED_PROJECTS_KEY, JSON.stringify([...followed]));
  return followed.has(projectId);
}

function renderProperties(list) {
  const followedProjects = getFollowedProjects();
  propertyList.innerHTML = list.map((property) => {
    const isFollowed = followedProjects.has(property.projectId);
    const detailUrl = getProjectDetailUrl(property);
    const imageSlides = property.images.map((image, index) => `
<div class="flex-none w-full snap-start relative" data-slide-index="${index + 1}">
<img alt="${property.name} 图片 ${index + 1}" class="w-full h-full object-cover" loading="lazy" src="${image}"/>
</div>`.trim()).join("");

    const tagList = property.tags.slice(0, 2).map((tag) => `<span class="property-card__tag">${tag}</span>`).join("");
    const carouselDots = property.images.map((_, index) => `<i class="property-carousel-dot ${index === 0 ? "is-active" : ""}"></i>`).join("");

    return `
<article class="property-card group relative transition-all duration-300 active:ring-2 active:ring-primary/20">
${detailUrl ? `<a aria-label="查看项目详情" class="card-link" href="${detailUrl}"></a>` : ""}
<div class="card-media relative flex h-52 snap-x snap-mandatory gap-0 overflow-x-auto scroll-smooth hide-scrollbar" data-carousel>
${imageSlides}
<div class="property-carousel-dots pointer-events-none" data-carousel-indicator>${carouselDots}</div>
</div>
<div class="property-card__body">
<div class="flex items-start justify-between gap-3">
<div class="min-w-0">
<h2 class="property-card__title">${property.name}</h2>
</div>
<button class="property-follow card-inner-action ${isFollowed ? "is-followed" : ""}" type="button" data-follow-project="${property.projectId}" data-project-name="${property.name}" aria-label="${isFollowed ? "取消关注" : "关注"} ${property.name}" aria-pressed="${isFollowed}">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/><path d="M18.5 15.5v5M16 18h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>
</div>
<p class="property-card__location">${property.location}</p>
<p class="property-card__meta">${property.sizeRange} · ${property.region}</p>
<div class="property-card__tags">${tagList}</div>
<p class="property-card__price">¥${property.priceMin}万-¥${property.priceMax}万</p>
</div>
</article>`.trim();
  }).join("");
  bindMediaCarousels();
}

propertyList.addEventListener("click", (event) => {
  const followButton = event.target.closest("[data-follow-project]");
  if (!followButton) {
    return;
  }
  event.preventDefault();
  event.stopPropagation();
  const followed = toggleFollowedProject(followButton.dataset.followProject);
  followButton.classList.toggle("is-followed", followed);
  followButton.setAttribute("aria-pressed", String(followed));
  followButton.setAttribute("aria-label", `${followed ? "取消关注" : "关注"} ${followButton.dataset.projectName}`);
});

function getCurrentSlideIndex(track) {
  const slides = Array.from(track.querySelectorAll("[data-slide-index]"));
  if (!slides.length) {
    return 1;
  }

  const closestSlide = slides.reduce((best, slide, index) => {
    const delta = Math.abs(track.scrollLeft - slide.offsetLeft);
    if (delta < best.delta) {
      return { index, delta };
    }
    return best;
  }, { index: 0, delta: Number.POSITIVE_INFINITY });

  return closestSlide.index + 1;
}

function bindMediaCarousels() {
  const carousels = propertyList.querySelectorAll("[data-carousel]");
  carousels.forEach((track) => {
    const indicator = track.querySelector("[data-carousel-indicator]");
    const slides = track.querySelectorAll("[data-slide-index]");
    if (!indicator || !slides.length) {
      return;
    }

    let frameId = 0;
    const syncIndicator = () => {
      const currentIndex = getCurrentSlideIndex(track) - 1;
      indicator.querySelectorAll(".property-carousel-dot").forEach((dot, index) => {
        dot.classList.toggle("is-active", index === currentIndex);
      });
    };

    track.addEventListener("scroll", () => {
      cancelAnimationFrame(frameId);
      frameId = requestAnimationFrame(syncIndicator);
    }, { passive: true });

    syncIndicator();
  });
}

function applyFilters() {
  const keyword = searchInput.value.trim().toLowerCase();
  const region = regionFilter.value;
  const sector = sectorFilter.value;
  const room = roomFilter.value;
  const areaRange = getSelectedAreaRange(areaFilter.value);
  const priceRange = getSelectedPriceRange(priceFilter.value);
  const hasActiveFilters = Boolean(keyword || region || sector || room || areaFilter.value || priceFilter.value);
  const filteredProperties = getActiveProperties().filter((property) => {
    const categoryFacet = property.category === "commercial"
      ? property.buildingType
      : property.category === "apartment"
        ? property.apartmentType
      : property.category === "office"
        ? property.propertyLevel
        : "";
    const searchPool = [
      property.name,
      property.location,
      property.region,
      property.sector,
      property.propertyYears,
      property.apartmentType,
      property.buildingType,
      property.propertyLevel,
      property.decoration,
      property.marketingAgent,
      property.propertyCompany,
      ...getPropertyRooms(property).map((roomType) => `${roomType}室`),
      ...property.tags,
      ...property.features
    ].filter(Boolean).join(" ").toLowerCase();
    const sizeRange = getPropertySizeRange(property);

    const matchesKeyword = !keyword || searchPool.includes(keyword);
    const matchesRegion = !region || property.region === region;
    const matchesSector = !sector || property.sector === sector;
    const matchesRoom = !room || (property.category === "residential"
      ? getPropertyRooms(property).includes(Number(room))
      : categoryFacet === room);
    const matchesArea = !areaRange || (sizeRange.min <= areaRange.max && sizeRange.max >= areaRange.min);
    const matchesPrice = !priceRange || (property.priceMin <= priceRange.max && property.priceMax >= priceRange.min);

    return matchesKeyword && matchesRegion && matchesSector && matchesRoom && matchesArea && matchesPrice;
  });

  renderProperties(filteredProperties);

  filterSummary.textContent = hasActiveFilters
    ? `筛选后找到 ${filteredProperties.length} 个在售楼盘`
    : `共 ${filteredProperties.length} 个在售楼盘`;
  emptyState.classList.toggle("hidden", filteredProperties.length !== 0);
  resetFiltersButton.disabled = !hasActiveFilters;
  applyFilterButton.textContent = `查看 ${filteredProperties.length} 个楼盘`;
  const activeFilterCount = getActiveFilterCount();
  openFilterButton.textContent = activeFilterCount ? `筛选 · ${activeFilterCount}` : "筛选";
}

openFilterButton.addEventListener("click", () => {
  setFilterModalVisibility(true);
});

closeFilterButton.addEventListener("click", () => {
  setFilterModalVisibility(false);
});

filterBackdrop.addEventListener("click", () => {
  setFilterModalVisibility(false);
});

applyFilterButton.addEventListener("click", () => {
  setFilterModalVisibility(false);
});

resetFiltersButton.addEventListener("click", () => {
  regionFilter.value = "";
  sectorFilter.value = "";
  roomFilter.value = "";
  areaFilter.value = "";
  priceFilter.value = "";
  applyFilters();
});

filterControls.forEach((control) => {
  const eventName = control.tagName === "INPUT" ? "input" : "change";
  control.addEventListener(eventName, applyFilters);
});

propertyTypeTabs.forEach((button) => {
  button.addEventListener("click", () => setActivePropertyType(button.dataset.propertyType));
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !filterModal.classList.contains("hidden")) {
    setFilterModalVisibility(false);
  }
});

populateFilterOptions();
syncPropertyTypeUI();
setFilterModalVisibility(false);
applyFilters();
</script>
</body></html>
